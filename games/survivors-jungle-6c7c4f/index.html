<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>הקוף האחרון</title>
<style>
  :root { --bg:#111; --bg2:#222; --fg:#fff; --accent:#fc3; --danger:#f44; --grid:#333; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: system-ui, "Segoe UI", "Rubik", Arial, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; font-weight:800; font-size:18px; pointer-events:none; text-shadow:0 2px 4px #000a; gap:10px; z-index:5; }
  #ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000a;
    backdrop-filter:blur(4px); z-index:20; padding:16px; box-sizing:border-box; }
  .card { background:var(--bg2); border:2px solid var(--accent); border-radius:20px; padding:24px 22px;
    width:min(420px,100%); text-align:center; box-shadow:0 12px 48px #000c; box-sizing:border-box; }
  .card h1 { margin:0 0 6px; font-size:30px; color:var(--accent); line-height:1.2; }
  .card h2 { margin:0 0 10px; font-size:22px; }
  .card p { opacity:.88; line-height:1.55; margin:8px 0; }
  .card .big { font-size:64px; line-height:1.1; margin:4px 0; }
  .card .stat { font-size:20px; font-weight:800; margin:6px 0; }
  .btn { background:var(--accent); color:var(--bg); border:0; border-radius:14px; padding:12px 28px; font-size:20px;
    font-weight:900; cursor:pointer; margin:8px 4px 0; font-family:inherit; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .choice { display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--bg);
    color:var(--fg); border:2px solid var(--grid); border-radius:14px; padding:12px 14px; margin:8px 0; cursor:pointer;
    font:inherit; font-size:17px; font-weight:700; }
  .choice:hover { border-color:var(--accent); }
  .choice .ic { font-size:30px; }
  .hidden { display:none !important; }
  .credit { font-size:12px; opacity:.5; margin-top:14px; }
  
</style>
</head>
<body>
<canvas id="c" dir="ltr"></canvas>
<div id="hud"><span id="hudR"></span><span id="hudL"></span></div>
<div id="app"></div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<script type="application/json" id="cfg">{"slug":"survivors-jungle-6c7c4f","title":"הקוף האחרון","icon":"🐒","howto":"שרוד מול גלי 🐍🦂🕷️🐊 ככל שתוכל! הנשק יורה לבד. זוז עם החיצים או WASD, או גרור באצבע. אסוף את היהלומים הזוהרים כדי לעלות שלב ולבחור שדרוג.","genreName":"הישרדות מול גלים","theme":{"id":"jungle","name":"ג'ונגל","palette":{"bg":"#0f2a17","bg2":"#173d22","fg":"#eaffea","accent":"#ffd23f","danger":"#ff5a36","grid":"#1e4d2b"},"hero":"🐒","enemies":["🐍","🦂","🕷️","🐊"],"boss":"🦍","pickup":"🍌","obstacle":["🌵","🪨"],"tiers":["🌱","🌿","🍀","🌴","🌳","🍌","🥥","🦜","🐯","👑"],"currency":"🍌","clickable":"🌴","buildings":[["🐒","קוף קוטף"],["🦜","תוכי שליח"],["🐘","פיל סבל"],["🛖","כפר"],["🗿","מקדש"],["🌋","הר געש"]],"words":{"place":"הג'ונגל","hero":"הקוף","thing":"הבננות","adj":"פראי"}},"params":{"enemySpeed":64.19,"spawnRate":0.96,"playerSpeed":211.29,"fireRate":1.79,"hp":6,"bossEvery":68}}</script>
<script>
"use strict";
// ---------- זמן ריצה משותף לכל המשחקים ----------
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const T = CFG.theme, P = T.palette, S = CFG.params;
for (const [k, v] of Object.entries(P)) document.documentElement.style.setProperty('--' + k, v);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const G = { state: 'menu', score: 0 };
const keys = new Set();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmt = n => {
  if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(CFG.slug + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(CFG.slug + ':' + k, JSON.stringify(v)); } catch (e) {} },
};

let AC = null, muted = store.get('muted', false);
function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.04) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}

// ציור אימוג'י דרך מטמון של קנבסים קטנים (מהיר בהרבה מ-fillText בכל פריים)
const emojiCache = new Map();
function drawEmoji(e, x, y, size, flip = false, alpha = 1) {
  const key = e + '|' + Math.round(size);
  let c = emojiCache.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const px = Math.ceil(size * 1.35 * DPR);
    c.width = c.height = px;
    const g = c.getContext('2d');
    g.font = `${size * DPR}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, px / 2, px / 2 + size * 0.08 * DPR);
    emojiCache.set(key, c);
  }
  const s = c.width / DPR;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(c, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// אפקטים: חלקיקים וטקסט צף
const fx = [];
function burst(x, y, color, n = 10, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
    fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4) });
  }
}
function floatText(x, y, text, color = P.accent, size = 20) {
  fx.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, text, color, size });
}
function updFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (!p.text) { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.life <= 0) fx.splice(i, 1);
  }
}
function drawFx(ox = 0, oy = 0) {
  for (const p of fx) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.text) {
      ctx.fillStyle = p.color; ctx.font = `900 ${p.size}px system-ui,sans-serif`; ctx.textAlign = 'center';
      ctx.strokeStyle = '#000a'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x - ox, p.y - oy); ctx.fillText(p.text, p.x - ox, p.y - oy);
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - ox, p.y - oy, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ממשק: HUD וכרטיסים
const $ov = document.getElementById('ov'), $card = document.getElementById('card');
const $hudR = document.getElementById('hudR'), $hudL = document.getElementById('hudL');
function hud(right = '', left = '') {
  if ($hudR._v !== right) { $hudR.innerHTML = right; $hudR._v = right; }
  if ($hudL._v !== left) { $hudL.innerHTML = left; $hudL._v = left; }
}
function showCard(html) { $card.innerHTML = html; $ov.classList.remove('hidden'); }
function hideCard() { $ov.classList.add('hidden'); }

function menu() {
  G.state = 'menu';
  const best = store.get('best', 0);
  showCard(`
    <div class="big">${CFG.icon}</div>
    <h1>${CFG.title}</h1>
    <p>${CFG.howto}</p>
    ${best ? `<div class="stat">🏆 שיא: ${fmt(best)}</div>` : ''}
    <button class="btn" id="play">▶ שחק</button>
    <div class="credit">${CFG.genreName} · ${T.name} · נוצר אוטומטית ע"י Game Forge</div>`);
  document.getElementById('play').onclick = startGame;
}
function startGame() {
  hideCard(); fx.length = 0; G.score = 0; G.state = 'play'; game.reset(); beep(660, 0.1, 'triangle');
}
function gameOver(score, extra = '') {
  G.state = 'over';
  const prev = store.get('best', 0), rec = score > prev;
  if (rec) store.set('best', score);
  beep(180, 0.4, 'sawtooth', 0.05);
  setTimeout(() => {
    showCard(`
      <div class="big">${rec ? '🏆' : '💥'}</div>
      <h1>${rec ? 'שיא חדש!' : 'המשחק נגמר'}</h1>
      <div class="stat">ניקוד: ${fmt(score)}</div>
      ${extra ? `<p>${extra}</p>` : ''}
      <p>שיא: ${fmt(Math.max(prev, score))}</p>
      <button class="btn" id="again">↻ שוב</button>`);
    document.getElementById('again').onclick = startGame;
  }, 450);
}

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  emojiCache.clear();
  if (game.resize) game.resize();
}

const ptr = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture?.(e.pointerId); if (G.state === 'play' || game.autostart) game.down?.(...ptr(e)); });
cv.addEventListener('pointermove', e => { if (G.state === 'play' || game.autostart) game.move?.(...ptr(e)); });
cv.addEventListener('pointerup', e => { if (G.state === 'play' || game.autostart) game.up?.(...ptr(e)); });
cv.addEventListener('pointercancel', e => { if (G.state === 'play') game.up?.(...ptr(e)); });
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (G.state === 'menu' || G.state === 'over') && !$ov.classList.contains('hidden')) {
    const b = $card.querySelector('.btn'); if (b) { b.click(); return; }
  }
  if (G.state === 'play') game.key?.(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
</script>
<script>
"use strict";
// ---------- לוגיקת המשחק (נוצרה מהתבנית: survivors) ----------
// הישרדות מול גלים: זזים, הנשק יורה לבד, אוספים ניסיון ובוחרים שדרוגים.
let pl, enemies, bullets, gems, t, kills, spawnAcc, fireAcc, st, xp, xpNeed, level, joy, bossT, shake;

const UPGRADES = [
  { id: 'dmg', icon: '💥', name: 'כוח אש', desc: '+1 נזק לכל קליע', apply: () => st.dmg += 1 },
  { id: 'rate', icon: '⚡', name: 'ירי מהיר', desc: '+25% קצב ירי', apply: () => st.rate *= 1.25 },
  { id: 'shots', icon: '🔱', name: 'ירי מפוצל', desc: '+1 קליע בכל יריה', apply: () => st.shots += 1 },
  { id: 'speed', icon: '👟', name: 'זריזות', desc: '+12% מהירות תנועה', apply: () => st.speed *= 1.12 },
  { id: 'magnet', icon: '🧲', name: 'מגנט', desc: '+40% טווח איסוף', apply: () => st.magnet *= 1.4 },
  { id: 'pierce', icon: '🗡️', name: 'חדירה', desc: 'קליע עובר דרך עוד אויב', apply: () => st.pierce += 1 },
  { id: 'heal', icon: '❤️', name: 'לב נוסף', desc: '+1 חיים מקסימליים וריפוי מלא', apply: () => { pl.maxHp += 1; pl.hp = pl.maxHp; } },
  { id: 'orbit', icon: T.pickup, name: 'מגן מסתובב', desc: 'כדור מגן שפוגע באויבים קרובים', apply: () => st.orbs += 1 },
];

function spawnEnemy(boss) {
  const a = Math.random() * Math.PI * 2, R = Math.max(W, H) / 2 + 80;
  const tier = Math.min(T.enemies.length - 1, Math.floor(Math.random() * (1 + t / 40)));
  const hp = boss ? 25 + t * 0.8 : 1 + tier + Math.floor(t / 45);
  enemies.push({
    x: pl.x + Math.cos(a) * R, y: pl.y + Math.sin(a) * R,
    e: boss ? T.boss : T.enemies[tier], hp, maxHp: hp, boss,
    r: boss ? 34 : 15, sp: (boss ? 0.55 : rand(0.8, 1.15)) * S.enemySpeed * (1 + t / 240), hit: 0,
  });
}

function levelUp() {
  level++; xp -= xpNeed; xpNeed = Math.floor(xpNeed * 1.35 + 3);
  G.state = 'pause'; beep(880, 0.15, 'triangle'); setTimeout(() => beep(1320, 0.15, 'triangle'), 120);
  const opts = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
  showCard(`<h1>עלית לשלב ${level}!</h1><p>בחר שדרוג:</p>` +
    opts.map((u, i) => `<button class="choice" data-i="${i}"><span class="ic">${u.icon}</span><span><b>${u.name}</b><br><small>${u.desc}</small></span></button>`).join(''));
  $card.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    opts[+b.dataset.i].apply(); hideCard(); G.state = 'play';
  });
}

function killEnemy(e, i) {
  enemies.splice(i, 1); kills++;
  burst(e.x, e.y, P.danger, e.boss ? 40 : 10);
  gems.push({ x: e.x, y: e.y, v: e.boss ? 20 : 1 + Math.floor(e.maxHp / 3) });
  if (e.boss) { shake = 0.4; floatText(e.x, e.y - 40, 'בוס הובס!', P.accent, 28); }
  beep(e.boss ? 120 : rand(300, 500), 0.05, 'square', 0.025);
}

const game = {
  reset() {
    pl = { x: 0, y: 0, hp: S.hp, maxHp: S.hp, inv: 0, face: 1 };
    enemies = []; bullets = []; gems = [];
    t = 0; kills = 0; spawnAcc = 0; fireAcc = 0; level = 1; xp = 0; xpNeed = 5; bossT = S.bossEvery; shake = 0; joy = null;
    st = { dmg: 1, rate: S.fireRate, shots: 1, speed: S.playerSpeed, magnet: 70, pierce: 0, orbs: 0 };
  },
  down(x, y) { joy = { sx: x, sy: y, x, y, dx: 0, dy: 0 }; },
  move(x, y) {
    if (!joy) return;
    joy.x = x; joy.y = y;
    const dx = x - joy.sx, dy = y - joy.sy, d = Math.hypot(dx, dy), m = Math.min(1, d / 50);
    joy.dx = d ? dx / d * m : 0; joy.dy = d ? dy / d * m : 0;
  },
  up() { joy = null; },
  update(dt) {
    t += dt; shake = Math.max(0, shake - dt); pl.inv = Math.max(0, pl.inv - dt);
    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) dx -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) dx += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) dy -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) dy += 1;
    if (dx || dy) { const d = Math.hypot(dx, dy); dx /= d; dy /= d; }
    if (joy) { dx = joy.dx; dy = joy.dy; }
    pl.x += dx * st.speed * dt; pl.y += dy * st.speed * dt;
    if (dx) pl.face = dx > 0 ? 1 : -1;

    spawnAcc += dt * S.spawnRate * (1 + t / 25);
    while (spawnAcc >= 1 && enemies.length < 350) { spawnAcc--; spawnEnemy(false); }
    bossT -= dt; if (bossT <= 0) { bossT = S.bossEvery; spawnEnemy(true); floatText(pl.x, pl.y - 60, '⚠️ בוס מתקרב!', P.danger, 26); }

    for (const e of enemies) {
      const d = dist(e.x, e.y, pl.x, pl.y) || 1;
      e.x += (pl.x - e.x) / d * e.sp * dt; e.y += (pl.y - e.y) / d * e.sp * dt;
      e.hit = Math.max(0, e.hit - dt);
      if (d < e.r + 14 && pl.inv <= 0) {
        pl.hp -= e.boss ? 2 : 1; pl.inv = 0.8; shake = 0.25; beep(90, 0.15, 'sawtooth', 0.06);
        if (pl.hp <= 0) { const m = Math.floor(t / 60), s = Math.floor(t % 60); gameOver(kills, `שרדת ${m}:${String(s).padStart(2, '0')} · שלב ${level}`); return; }
      }
    }

    fireAcc += dt;
    if (fireAcc >= 1 / st.rate && enemies.length) {
      fireAcc = 0;
      let best = null, bd = 1e9;
      for (const e of enemies) { const d = dist(e.x, e.y, pl.x, pl.y); if (d < bd) { bd = d; best = e; } }
      if (bd < Math.max(W, H)) {
        const a0 = Math.atan2(best.y - pl.y, best.x - pl.x);
        for (let i = 0; i < st.shots; i++) {
          const a = a0 + (i - (st.shots - 1) / 2) * 0.16;
          bullets.push({ x: pl.x, y: pl.y, vx: Math.cos(a) * 460, vy: Math.sin(a) * 460, life: 1.4, pierce: st.pierce, hits: new Set() });
        }
        beep(rand(700, 900), 0.03, 'square', 0.012);
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0;
      for (let j = enemies.length - 1; j >= 0 && !dead; j--) {
        const e = enemies[j];
        if (!b.hits.has(e) && dist(b.x, b.y, e.x, e.y) < e.r + 5) {
          b.hits.add(e); e.hp -= st.dmg; e.hit = 0.1;
          if (e.hp <= 0) killEnemy(e, j);
          if (b.pierce-- <= 0) dead = true;
        }
      }
      if (dead) bullets.splice(i, 1);
    }

    // מגינים מסתובבים
    for (let k = 0; k < st.orbs; k++) {
      const a = t * 3 + k * Math.PI * 2 / st.orbs, ox = pl.x + Math.cos(a) * 70, oy = pl.y + Math.sin(a) * 70;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (e.hit <= 0 && dist(ox, oy, e.x, e.y) < e.r + 12) { e.hp -= st.dmg; e.hit = 0.25; if (e.hp <= 0) killEnemy(e, j); }
      }
    }

    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i], d = dist(g.x, g.y, pl.x, pl.y);
      if (d < st.magnet) { g.x += (pl.x - g.x) / d * 520 * dt; g.y += (pl.y - g.y) / d * 520 * dt; }
      if (d < 18) {
        gems.splice(i, 1); xp += g.v; beep(1200, 0.03, 'sine', 0.02);
        if (xp >= xpNeed) { levelUp(); break; }
      }
    }
    G.score = kills;
  },
  draw() {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    if (!pl) return;
    const sx = shake ? rand(-6, 6) * shake * 4 : 0, sy = shake ? rand(-6, 6) * shake * 4 : 0;
    const cx = pl.x - W / 2 + sx, cy = pl.y - H / 2 + sy;
    // רצפה
    const cell = 64;
    ctx.strokeStyle = P.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = -((cx % cell) + cell) % cell; x < W; x += cell) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -((cy % cell) + cell) % cell; y < H; y += cell) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    for (const g of gems) {
      ctx.fillStyle = P.accent; ctx.beginPath();
      const x = g.x - cx, y = g.y - cy, r = g.v > 5 ? 8 : 5;
      ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.fill();
    }
    for (const e of enemies) {
      const x = e.x - cx, y = e.y - cy;
      if (x < -60 || y < -60 || x > W + 60 || y > H + 60) continue;
      if (e.hit > 0) { ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(x, y, e.r + 4, 0, 7); ctx.fill(); }
      drawEmoji(e.e, x, y, e.r * 2, e.x < pl.x);
      if (e.boss) {
        ctx.fillStyle = '#0008'; ctx.fillRect(x - 40, y - e.r - 14, 80, 7);
        ctx.fillStyle = P.danger; ctx.fillRect(x - 40, y - e.r - 14, 80 * e.hp / e.maxHp, 7);
      }
    }
    ctx.fillStyle = P.accent; ctx.shadowColor = P.accent; ctx.shadowBlur = 10;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x - cx, b.y - cy, 4.5, 0, 7); ctx.fill(); }
    ctx.shadowBlur = 0;
    for (let k = 0; k < st.orbs; k++) {
      const a = t * 3 + k * Math.PI * 2 / st.orbs;
      drawEmoji(T.pickup, pl.x + Math.cos(a) * 70 - cx, pl.y + Math.sin(a) * 70 - cy, 24);
    }
    if (!(pl.inv > 0 && Math.floor(pl.inv * 12) % 2)) drawEmoji(T.hero, pl.x - cx, pl.y - cy, 38, pl.face > 0);
    drawFx(cx, cy);

    // פס ניסיון
    ctx.fillStyle = '#0007'; ctx.fillRect(0, H - 10, W, 10);
    ctx.fillStyle = P.accent; ctx.fillRect(0, H - 10, W * Math.min(1, xp / xpNeed), 10);
    if (joy) {
      ctx.strokeStyle = '#fff5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 50, 0, 7); ctx.stroke();
      ctx.fillStyle = '#fff6'; ctx.beginPath(); ctx.arc(joy.sx + joy.dx * 50, joy.sy + joy.dy * 50, 20, 0, 7); ctx.fill();
    }
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    hud(`${'❤️'.repeat(Math.max(0, pl.hp))}<span style="opacity:.35">${'🖤'.repeat(Math.max(0, pl.maxHp - pl.hp))}</span>`,
      `⏱ ${m}:${String(s).padStart(2, '0')} · ⭐ ${level} · ☠️ ${kills}`);
  },
};

</script>
<script>
"use strict";
window.addEventListener('resize', fit);
fit();
if (game.init) game.init();
if (game.autostart) { G.state = 'play'; game.reset(); } else menu();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') game.update(dt);
  updFx(G.state === 'pause' ? 0 : dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
