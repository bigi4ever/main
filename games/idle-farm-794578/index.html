<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>טייקון החווה</title>
<style>
  :root { --bg:#111; --bg2:#222; --fg:#fff; --accent:#fc3; --danger:#f44; --grid:#333; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: system-ui, "Segoe UI", "Rubik", Arial, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; font-weight:800; font-size:18px; pointer-events:none; text-shadow:0 2px 4px #000a; gap:10px; z-index:5; }
  #ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000a;
    backdrop-filter:blur(4px); z-index:20; padding:16px; box-sizing:border-box; }
  .card { background:var(--bg2); border:2px solid var(--accent); border-radius:20px; padding:24px 22px;
    width:min(420px,100%); text-align:center; box-shadow:0 12px 48px #000c; box-sizing:border-box; }
  .card h1 { margin:0 0 6px; font-size:30px; color:var(--accent); line-height:1.2; }
  .card h2 { margin:0 0 10px; font-size:22px; }
  .card p { opacity:.88; line-height:1.55; margin:8px 0; }
  .card .big { font-size:64px; line-height:1.1; margin:4px 0; }
  .card .stat { font-size:20px; font-weight:800; margin:6px 0; }
  .btn { background:var(--accent); color:var(--bg); border:0; border-radius:14px; padding:12px 28px; font-size:20px;
    font-weight:900; cursor:pointer; margin:8px 4px 0; font-family:inherit; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .choice { display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--bg);
    color:var(--fg); border:2px solid var(--grid); border-radius:14px; padding:12px 14px; margin:8px 0; cursor:pointer;
    font:inherit; font-size:17px; font-weight:700; }
  .choice:hover { border-color:var(--accent); }
  .choice .ic { font-size:30px; }
  .hidden { display:none !important; }
  .credit { font-size:12px; opacity:.5; margin-top:14px; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:52px 12px 12px; box-sizing:border-box; z-index:4; pointer-events:none; }
#app > * { pointer-events:auto; }
.money { font-size:40px; font-weight:900; color:var(--accent); text-shadow:0 3px 10px #000a; }
.rate { opacity:.8; margin-bottom:6px; }
#tap { font-size:110px; line-height:1; background:radial-gradient(circle, var(--accent) 0%, transparent 68%); border:0; border-radius:50%;
  width:180px; height:180px; cursor:pointer; transition:transform .08s; filter:drop-shadow(0 8px 18px #000a); flex:none; }
#tap:active { transform:scale(.9); }
.tapinfo { font-size:14px; opacity:.75; margin:4px 0 10px; }
.shop { width:min(520px,100%); overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px; padding-bottom:20px; }
.row { display:flex; align-items:center; gap:10px; background:var(--bg2); border:2px solid var(--grid); border-radius:14px; padding:8px 12px; }
.row .ic { font-size:34px; width:44px; text-align:center; }
.row .info { flex:1; min-width:0; }
.row .nm { font-weight:800; }
.row .sub { font-size:13px; opacity:.75; }
.row .own { font-size:22px; font-weight:900; opacity:.6; min-width:32px; text-align:center; }
.row button { background:var(--accent); color:var(--bg); border:0; border-radius:10px; padding:8px 12px; font:inherit; font-weight:900; cursor:pointer; min-width:84px; }
.row button:disabled { opacity:.35; cursor:default; }
.row.locked { opacity:.45; }
.sect { font-weight:900; opacity:.7; margin-top:6px; }
.pop { direction:ltr; position:fixed; pointer-events:none; font-weight:900; color:var(--accent); font-size:24px; text-shadow:0 2px 6px #000; animation:pop .8s ease-out forwards; z-index:6; }
@keyframes pop { to { transform:translateY(-70px); opacity:0; } }

</style>
</head>
<body>
<canvas id="c" dir="ltr"></canvas>
<div id="hud"><span id="hudR"></span><span id="hudL"></span></div>
<div id="app"></div>
<div id="ov" class="hidden"><div class="card" id="card"></div></div>
<script type="application/json" id="cfg">{"slug":"idle-farm-794578","title":"טייקון החווה","icon":"🌽","howto":"לחץ על 🌽 כדי לאסוף 🥚, וקנה מחוללים שמייצרים בשבילך. ההתקדמות נשמרת.","genreName":"קליקר / איידל","theme":{"id":"farm","name":"חווה","palette":{"bg":"#2b3a12","bg2":"#3d5219","fg":"#fbffe8","accent":"#ffb627","danger":"#e63946","grid":"#4a6320"},"hero":"🐔","enemies":["🦊","🐀","🐗","🐦‍⬛"],"boss":"🐻","pickup":"🥚","obstacle":["🪵","🌾"],"tiers":["🌱","🌾","🥕","🍅","🌽","🥚","🐣","🐔","🐄","🚜"],"gems":["🥕","🍅","🌽","🥚","🍎","🍇"],"currency":"🥚","clickable":"🌽","buildings":[["🐔","לול"],["🐄","רפת"],["🌻","שדה"],["🚜","טרקטור"],["🏡","משק"],["🏞️","עמק שלם"]],"words":{"place":"החווה","hero":"התרנגולת","thing":"הביצים","adj":"כפרי"}},"params":{"speed":0.9508196721311475,"click":1}}</script>
<script>
"use strict";
// ---------- זמן ריצה משותף לכל המשחקים ----------
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const T = CFG.theme, P = T.palette, S = CFG.params;
for (const [k, v] of Object.entries(P)) document.documentElement.style.setProperty('--' + k, v);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const G = { state: 'menu', score: 0 };
const keys = new Set();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const fmt = n => {
  if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'aa', 'ab', 'ac', 'ad'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(CFG.slug + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(CFG.slug + ':' + k, JSON.stringify(v)); } catch (e) {} },
};

let AC = null, muted = store.get('muted', false);
function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.04) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}

// ציור אימוג'י דרך מטמון של קנבסים קטנים (מהיר בהרבה מ-fillText בכל פריים)
const emojiCache = new Map();
function drawEmoji(e, x, y, size, flip = false, alpha = 1) {
  const key = e + '|' + Math.round(size);
  let c = emojiCache.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const px = Math.ceil(size * 1.35 * DPR);
    c.width = c.height = px;
    const g = c.getContext('2d');
    g.font = `${size * DPR}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(e, px / 2, px / 2 + size * 0.08 * DPR);
    emojiCache.set(key, c);
  }
  const s = c.width / DPR;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(c, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// אפקטים: חלקיקים וטקסט צף
const fx = [];
function burst(x, y, color, n = 10, speed = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
    fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4) });
  }
}
function floatText(x, y, text, color = P.accent, size = 20) {
  fx.push({ x, y, vx: 0, vy: -50, life: 0.9, max: 0.9, text, color, size });
}
function updFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (!p.text) { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.life <= 0) fx.splice(i, 1);
  }
}
function drawFx(ox = 0, oy = 0) {
  for (const p of fx) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.text) {
      ctx.fillStyle = p.color; ctx.font = `900 ${p.size}px system-ui,sans-serif`; ctx.textAlign = 'center';
      ctx.strokeStyle = '#000a'; ctx.lineWidth = 4; ctx.strokeText(p.text, p.x - ox, p.y - oy); ctx.fillText(p.text, p.x - ox, p.y - oy);
    } else {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - ox, p.y - oy, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ממשק: HUD וכרטיסים
const $ov = document.getElementById('ov'), $card = document.getElementById('card');
const $hudR = document.getElementById('hudR'), $hudL = document.getElementById('hudL');
function hud(right = '', left = '') {
  if ($hudR._v !== right) { $hudR.innerHTML = right; $hudR._v = right; }
  if ($hudL._v !== left) { $hudL.innerHTML = left; $hudL._v = left; }
}
function showCard(html) { $card.innerHTML = html; $ov.classList.remove('hidden'); }
function hideCard() { $ov.classList.add('hidden'); }

function menu() {
  G.state = 'menu';
  const best = store.get('best', 0);
  showCard(`
    <div class="big">${CFG.icon}</div>
    <h1>${CFG.title}</h1>
    <p>${CFG.howto}</p>
    ${best ? `<div class="stat">🏆 שיא: ${fmt(best)}</div>` : ''}
    <button class="btn" id="play">▶ שחק</button>
    <div class="credit">${CFG.genreName} · ${T.name} · נוצר אוטומטית ע"י Game Forge</div>`);
  document.getElementById('play').onclick = startGame;
}
function startGame() {
  hideCard(); fx.length = 0; G.score = 0; G.state = 'play'; game.reset(); beep(660, 0.1, 'triangle');
}
function gameOver(score, extra = '') {
  G.state = 'over';
  const prev = store.get('best', 0), rec = score > prev;
  if (rec) store.set('best', score);
  beep(180, 0.4, 'sawtooth', 0.05);
  setTimeout(() => {
    showCard(`
      <div class="big">${rec ? '🏆' : '💥'}</div>
      <h1>${rec ? 'שיא חדש!' : 'המשחק נגמר'}</h1>
      <div class="stat">ניקוד: ${fmt(score)}</div>
      ${extra ? `<p>${extra}</p>` : ''}
      <p>שיא: ${fmt(Math.max(prev, score))}</p>
      <button class="btn" id="again">↻ שוב</button>`);
    document.getElementById('again').onclick = startGame;
  }, 450);
}

function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  emojiCache.clear();
  if (typeof game !== 'undefined' && game.resize) game.resize();
}

const ptr = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
// אירועי קלט יכולים להגיע לפני שסקריפט המשחק נטען (למשל אצבע על המסך בזמן הטעינה), לכן בודקים שהמשחק קיים ושהלולאה התחילה
let booted = false;
const ready = () => booted && typeof game !== 'undefined';
const active = () => ready() && (G.state === 'play' || game.autostart);
cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch {} if (active()) game.down?.(...ptr(e)); });
cv.addEventListener('pointermove', e => { if (active()) game.move?.(...ptr(e)); });
cv.addEventListener('pointerup', e => { if (active()) game.up?.(...ptr(e)); });
cv.addEventListener('pointercancel', e => { if (ready() && G.state === 'play') game.up?.(...ptr(e)); });
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (G.state === 'menu' || G.state === 'over') && !$ov.classList.contains('hidden')) {
    const b = $card.querySelector('.btn'); if (b) { b.click(); return; }
  }
  if (ready() && G.state === 'play') game.key?.(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
</script>
<script>
"use strict";
// ---------- לוגיקת המשחק (נוצרה מהתבנית: idle) ----------
// קליקר / איידל: לוחצים לאיסוף, קונים מחוללים שמייצרים לבד. ההתקדמות נשמרת, כולל רווחים בזמן היעדרות.
const BASE_COST = [15, 110, 1200, 13000, 140000, 1.6e6];
const BASE_PROD = [0.15, 1.2, 9, 50, 280, 1600];
const app = document.getElementById('app');
let s, lastSave = 0, bg = [];

const cost = i => Math.ceil(BASE_COST[i] * Math.pow(1.15, s.owned[i]));
const mult = i => Math.pow(2, Math.floor(s.owned[i] / 25)); // כל 25 יחידות: פי 2
const prodOf = i => BASE_PROD[i] * S.speed * s.owned[i] * mult(i);
const perSec = () => BASE_PROD.reduce((a, _, i) => a + prodOf(i), 0) * (1 + s.prestige * 0.1);
const clickVal = () => S.click * Math.pow(2, s.clickLvl) + perSec() * 0.02;
const clickCost = () => Math.ceil(50 * Math.pow(6, s.clickLvl));
const PRESTIGE_AT = 1e7;

function save() { s.t = Date.now(); store.set('save', s); store.set('best', Math.floor(s.total)); }

function render() {
  app.innerHTML = `
    <div class="money" id="money"></div>
    <div class="rate" id="rate"></div>
    <button id="tap" aria-label="לחץ">${T.clickable}</button>
    <div class="tapinfo" id="tapinfo"></div>
    <div class="shop">
      <div class="sect">שדרוגים</div>
      <div class="row"><div class="ic">👆</div><div class="info"><div class="nm">לחיצה חזקה</div><div class="sub">כל לחיצה שווה פי 2</div></div><div class="own" id="clvl"></div><button id="bclick"></button></div>
      <div class="sect">מחוללים</div>
      ${T.buildings.map(([e, n], i) => `
        <div class="row" id="r${i}"><div class="ic">${e}</div><div class="info"><div class="nm">${n}</div><div class="sub" id="sub${i}"></div></div>
        <div class="own" id="own${i}"></div><button id="b${i}"></button></div>`).join('')}
      <div class="sect">התחלה מחדש</div>
      <div class="row"><div class="ic">🌟</div><div class="info"><div class="nm">לידה מחדש</div><div class="sub" id="psub"></div></div><button id="bpres">אפס</button></div>
      <div class="row"><div class="ic">🔊</div><div class="info"><div class="nm">צלילים</div></div><button id="bmute"></button></div>
    </div>`;
  const tap = document.getElementById('tap');
  tap.addEventListener('pointerdown', e => {
    const v = clickVal(); s.money += v; s.total += v; s.clicks++;
    const el = document.createElement('div'); el.className = 'pop'; el.textContent = '+' + fmt(v);
    el.style.left = (e.clientX - 20 + rand(-20, 20)) + 'px'; el.style.top = (e.clientY - 30) + 'px';
    document.body.appendChild(el); setTimeout(() => el.remove(), 800);
    burst(e.clientX, e.clientY, P.accent, 6, 140);
    beep(rand(500, 700), 0.04, 'triangle', 0.03);
  });
  document.getElementById('bclick').onclick = () => {
    const c = clickCost(); if (s.money < c) return; s.money -= c; s.clickLvl++; beep(880, 0.1, 'triangle');
  };
  T.buildings.forEach((_, i) => document.getElementById('b' + i).onclick = () => {
    const c = cost(i); if (s.money < c) return;
    s.money -= c; s.owned[i]++; beep(660 + i * 80, 0.08, 'triangle');
    if (s.owned[i] % 25 === 0) floatText(W / 2, H / 2, `${T.buildings[i][0]} ייצור כפול!`, P.accent, 28);
  });
  document.getElementById('bpres').onclick = () => {
    if (s.total < PRESTIGE_AT) return;
    const gain = Math.floor(Math.sqrt(s.total / PRESTIGE_AT));
    s = fresh(s.prestige + gain); save(); beep(1000, 0.3, 'sine');
  };
  document.getElementById('bmute').onclick = () => { muted = !muted; store.set('muted', muted); };
}

function fresh(prestige = 0) { return { money: 0, total: 0, owned: T.buildings.map(() => 0), clickLvl: 0, clicks: 0, prestige, t: Date.now() }; }

function refresh() {
  document.getElementById('money').textContent = `${T.currency} ${fmt(Math.floor(s.money))}`;
  document.getElementById('rate').textContent = `${fmt(perSec())} לשנייה` + (s.prestige ? ` · 🌟 בונוס ${s.prestige * 10}%` : '');
  document.getElementById('tapinfo').textContent = `כל לחיצה: \u2066+${fmt(clickVal())}\u2069`; // בידוד LTR כדי שהפלוס יופיע לפני המספר
  document.getElementById('clvl').textContent = s.clickLvl;
  const bc = document.getElementById('bclick'); bc.textContent = fmt(clickCost()); bc.disabled = s.money < clickCost();
  T.buildings.forEach((_, i) => {
    const visible = i === 0 || s.owned[i - 1] > 0 || s.total >= BASE_COST[i] * 0.5;
    document.getElementById('r' + i).classList.toggle('locked', !visible);
    document.getElementById('own' + i).textContent = s.owned[i];
    document.getElementById('sub' + i).textContent = `${fmt(BASE_PROD[i] * S.speed * mult(i))} לשנייה ליחידה` + (mult(i) > 1 ? ` (×${mult(i)})` : '') + ` · עוד ${25 - s.owned[i] % 25} להכפלה`;
    const b = document.getElementById('b' + i); b.textContent = fmt(cost(i)); b.disabled = !visible || s.money < cost(i);
  });
  const gain = Math.floor(Math.sqrt(s.total / PRESTIGE_AT));
  document.getElementById('psub').textContent = s.total >= PRESTIGE_AT
    ? `מתחילים מאפס ומקבלים ${gain} 🌟 (+${gain * 10}% ייצור לתמיד)` : `נפתח אחרי ${fmt(PRESTIGE_AT)} ${T.currency} מצטבר`;
  document.getElementById('bpres').disabled = s.total < PRESTIGE_AT;
  document.getElementById('bmute').textContent = muted ? 'כבוי' : 'פועל';
}

const game = {
  autostart: true,
  init() {
    s = Object.assign(fresh(), store.get('save', {}));
    if (s.owned.length !== T.buildings.length) s = fresh();
    render();
    const away = Math.min(2 * 3600, (Date.now() - s.t) / 1000);
    const earned = perSec() * away * 0.5;
    if (earned >= 1) {
      s.money += earned; s.total += earned;
      showCard(`<div class="big">${T.clickable}</div><h1>ברוך שובך!</h1><p>כשלא היית כאן הרווחת</p><div class="stat">${T.currency} ${fmt(earned)}</div><button class="btn" id="ok">יופי!</button>`);
      document.getElementById('ok').onclick = hideCard;
    }
    for (let i = 0; i < 24; i++) bg.push({ x: Math.random(), y: Math.random(), v: rand(0.02, 0.06), s: rand(18, 34), e: pick([T.currency, ...T.buildings.map(b => b[0])]) });
    window.addEventListener('beforeunload', save);
  },
  reset() {},
  update(dt) {
    const g = perSec() * dt; s.money += g; s.total += g;
    lastSave += dt; if (lastSave > 5) { lastSave = 0; save(); }
    for (const b of bg) { b.y -= b.v * dt; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); } }
  },
  draw() {
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    for (const b of bg) drawEmoji(b.e, b.x * W, b.y * H, b.s, false, 0.12);
    drawFx();
    if (s) refresh();
    hud(CFG.title, s && s.prestige ? `🌟 ${s.prestige}` : '');
  },
};

</script>
<script>
"use strict";
window.addEventListener('resize', fit);
fit();
if (game.init) game.init();
if (game.autostart) { G.state = 'play'; game.reset(); } else menu();
booted = true;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') game.update(dt);
  updFx(G.state === 'pause' ? 0 : dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
